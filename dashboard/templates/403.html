<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No tienes permiso · NDIP</title>
  <style>
    /* Página independiente: no usa archivos externos para que funcione aunque algo más esté fallando */
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,sans-serif; background:#EEF2F6; color:#16232F; padding:24px; box-sizing:border-box; }
    .box { background:#fff; border:1px solid #D9E1E8; border-radius:18px; padding:36px 32px; max-width:460px; text-align:center; }
    .code { font-size:14px; font-weight:700; letter-spacing:1.4px; color:#0B6E99; }
    h1 { font-size:26px; margin:10px 0; }
    p { line-height:1.6; color:#51606E; margin:0 0 22px; }
    a { display:inline-block; background:#0B6E99; color:#fff; text-decoration:none; font-weight:600; padding:11px 20px; border-radius:10px; }
    a:hover { background:#07506F; }
  </style>
</head>
<body>
  <main class="box">
    <div class="code">ERROR 403</div>
    <h1>No tienes permiso</h1>
    <p>Esta página no está disponible para tu cuenta.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
